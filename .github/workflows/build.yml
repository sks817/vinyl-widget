name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o VinylWidget.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        working-directory: VinylWidget
        run: gradle assembleDebug --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Record Widget ${{ github.run_number }}
          files: |
            VinylWidget/app/build/outputs/apk/debug/app-debug.apk
            VinylWidget/weather/build/outputs/apk/debug/weather-debug.apk
